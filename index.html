<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Apply the saved theme before first paint — dark is the default.
      (function () {
        try {
          var m = document.cookie.match(/(?:^|;\s*)theme=(light|dark)/);
          document.documentElement.classList.add(
            m && m[1] === "light" ? "light" : "dark",
          );
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#0b0e15"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#f3f5fb"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <meta
      name="description"
      content="Toucan Motion turns your ideas and assets into TikTok-ready videos — automatically."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Toucan Motion — AI TikTok Video Studio"
    />
    <meta
      property="og:description"
      content="Turn your ideas and assets into TikTok-ready videos — automatically."
    />
    <meta property="og:image" content="/android-chrome-512x512.png" />
    <meta name="twitter:card" content="summary" />
    <title>Toucan Motion — AI TikTok Video Studio</title>
  </head>

</html>
