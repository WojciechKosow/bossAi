# Non-secret defaults, safe to check in (application.properties holds the
# per-environment secrets — DB creds, jwt.secret, OAuth client id/secret —
# and is gitignored).

server:
  # Railway (and most PaaS reverse proxies) terminate TLS at the edge and
  # forward plain HTTP to the container, attaching X-Forwarded-* headers.
  # Without this, Spring builds absolute URLs (including the OAuth2
  # redirect_uri sent to Google) from the internal request, i.e.
  # http://localhost:8080 instead of the public https:// origin.
  forward-headers-strategy: framework
  tomcat:
    # Podcast episodes are large multi-hour files. Don't let Tomcat cap or
    # "swallow" the request body — the multipart limits below are the real gate.
    max-swallow-size: -1
    max-http-form-post-size: -1

spring:
  servlet:
    multipart:
      # A 2-hour episode is a multi-hundred-MB (sometimes multi-GB) upload. The
      # framework default is 1MB, which rejects every real podcast. Raise it so
      # the podcast → clips upload path works end to end.
      max-file-size: 2GB
      max-request-size: 2GB

postmark:
  api:
    # Postmark's HTTP API over HTTPS — not SMTP. Railway (like most PaaS
    # containers) blocks outbound SMTP ports outright, so smtp.postmarkapp.com
    # on 587 times out no matter what; plain HTTPS never has that problem.
    # Set POSTMARK_SERVER_TOKEN in Railway; left blank locally so the app
    # still boots without it (sends will just fail auth).
    server-token: ${POSTMARK_SERVER_TOKEN:}

app:
  # Base URL of the deployed frontend, used to redirect back after OAuth2
  # login. Override with FRONTEND_URL in production.
  frontend-url: ${FRONTEND_URL:http://localhost:5173}

  # Base URL of this backend itself, used for links that point back at our
  # own endpoints (e.g. the email-change confirmation links). Override with
  # BACKEND_URL in production.
  backend-url: ${BACKEND_URL:http://localhost:8080}

  mail:
    # Must be a Sender Signature or a domain verified in Postmark, or every
    # send gets rejected. Set MAIL_FROM in Railway.
    from: ${MAIL_FROM:no-reply@localhost}
